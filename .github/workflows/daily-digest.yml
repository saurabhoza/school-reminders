name: Daily school digest

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      received_day:
        description: 'London receipt date (YYYY-MM-DD), defaults to yesterday'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-school-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application
        run: python -m pip install -e .
      - name: Read school mail and email the digest
        shell: bash
        env:
          RECEIVED_DAY: ${{ inputs.received_day }}
          SCHOOL_SENDER: ${{ vars.SCHOOL_SENDER || secrets.SCHOOL_SENDER }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          EMAIL_ENABLED: 'true'
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          CLASSIFY_NOTICES: ${{ vars.CLASSIFY_NOTICES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          : "${SCHOOL_SENDER:?Set SCHOOL_SENDER under Settings > Secrets and variables > Actions as a repository variable or secret. This job has no GitHub environment.}"
          : "${GMAIL_TOKEN_JSON:?Set the GMAIL_TOKEN_JSON repository secret}"
          : "${EMAIL_FROM:?Set the EMAIL_FROM repository secret}"
          : "${EMAIL_TO:?Set the EMAIL_TO repository secret}"
          : "${SMTP_PASSWORD:?Set the SMTP_PASSWORD repository secret}"
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/digest.XXXXXXXX")
          trap 'rm -rf -- "$private_dir"' EXIT
          printf '%s' "$GMAIL_TOKEN_JSON" > "$private_dir/token.json"
          unset GMAIL_TOKEN_JSON
          day=${RECEIVED_DAY:-$(TZ=Europe/London date --date=yesterday +%F)}
          args=(--sender "$SCHOOL_SENDER" --token "$private_dir/token.json" --non-interactive --safe-diagnostics --received-day "$day")
          if [[ "$CLASSIFY_NOTICES" == true ]]; then
            : "${GROQ_API_KEY:?Set GROQ_API_KEY for classified digests}"
            args+=(--classify --output "$private_dir/notices.json")
          fi
          # Keep provider logs and argument values on stderr out of Actions logs.
          if python -m school_reminders "${args[@]}" 2>/dev/null; then
            exit 0
          else
            status=$?
            if [[ "$status" == 2 ]]; then
              echo "::error::Invalid scan arguments. Enter the receipt date as YYYY-MM-DD."
            else
              echo "::error::Daily digest failed. See the stage diagnostic above. If no diagnostic appears, check that the application installed and started."
            fi
            exit "$status"
          fi
